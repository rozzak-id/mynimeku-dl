<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 240" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&amp;display=swap');
      .font-title { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 800; }
      .font-body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 400; }
      .font-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    </style>
  </defs>

  <!-- Background Card -->
  <rect x="1" y="1" width="878" height="238" rx="8" fill="#0f1115" stroke="#282d37" stroke-width="1.5"/>

  <!-- Top Window Bar -->
  <rect x="1" y="1" width="878" height="38" rx="8" fill="#13161a"/>
  <rect x="1" y="30" width="878" height="9" fill="#13161a"/>
  <line x1="1" y1="39" x2="879" y2="39" stroke="#282d37" stroke-width="1"/>

  <!-- Window Dots -->
  <circle cx="24" cy="20" r="4.5" fill="#ef4444"/>
  <circle cx="39" cy="20" r="4.5" fill="#f59e0b"/>
  <circle cx="54" cy="20" r="4.5" fill="#10b981"/>

  <text x="76" y="24" fill="#6b7280" class="font-mono" font-size="11">animeku — flat dark ui</text>
  <text x="856" y="24" fill="#4b5563" class="font-mono" font-size="11" text-anchor="end">v2.2.0</text>

  <!-- Main Left Content: Name Directly -->
  <text x="44" y="106" fill="#ffffff" class="font-title" font-size="44" letter-spacing="1">ANIMEKU</text>
  <text x="44" y="136" fill="#9ca3af" class="font-body" font-size="14">Multi-Source Anime Streaming &amp; Downloader Terminal</text>

  <!-- Flat Tags Row -->
  <g transform="translate(44, 168)">
    <!-- Tag 1 -->
    <rect x="0" y="0" width="94" height="28" rx="4" fill="#181b20" stroke="#282d37" stroke-width="1"/>
    <text x="47" y="18" fill="#cbd5e1" class="font-body" font-size="11" font-weight="600" text-anchor="middle">7 SOURCES</text>

    <!-- Tag 2 -->
    <rect x="102" y="0" width="104" height="28" rx="4" fill="#181b20" stroke="#282d37" stroke-width="1"/>
    <text x="154" y="18" fill="#cbd5e1" class="font-body" font-size="11" font-weight="600" text-anchor="middle">MINI PLAYER</text>

    <!-- Tag 3 -->
    <rect x="214" y="0" width="84" height="28" rx="4" fill="#181b20" stroke="#282d37" stroke-width="1"/>
    <text x="256" y="18" fill="#cbd5e1" class="font-body" font-size="11" font-weight="600" text-anchor="middle">FLAT UI</text>

    <!-- Tag 4 -->
    <rect x="306" y="0" width="86" height="28" rx="4" fill="#181b20" stroke="#282d37" stroke-width="1"/>
    <text x="349" y="18" fill="#cbd5e1" class="font-body" font-size="11" font-weight="600" text-anchor="middle">AD-FREE</text>

    <!-- Tag 5: Status -->
    <rect x="400" y="0" width="80" height="28" rx="4" fill="#0284c7"/>
    <text x="440" y="18" fill="#ffffff" class="font-body" font-size="11" font-weight="600" text-anchor="middle">ACTIVE</text>
  </g>

  <!-- Right Side Terminal Card -->
  <g transform="translate(548, 58)">
    <rect width="292" height="148" rx="6" fill="#14171d" stroke="#282d37" stroke-width="1"/>
    <rect width="292" height="28" rx="6" fill="#181b20"/>
    <line x1="0" y1="28" x2="292" y2="28" stroke="#282d37" stroke-width="1"/>
    <text x="14" y="18" fill="#6b7280" class="font-mono" font-size="10">cli / interactive</text>

    <text x="14" y="54" fill="#38bdf8" class="font-mono" font-size="12">$ animeku</text>
    <text x="14" y="78" fill="#d1d5db" class="font-mono" font-size="11">&gt; Nonton Langsung</text>
    <text x="14" y="98" fill="#9ca3af" class="font-mono" font-size="11">&gt; Download Video</text>
    <text x="14" y="118" fill="#9ca3af" class="font-mono" font-size="11">&gt; Unduh Semua Episode</text>
    <text x="14" y="146" fill="#10b981" class="font-mono" font-size="10">Resolusi: 1080P | 720P | 480P</text>
  </g>
</svg>
